name: Release

# Pushing a tag like v0.1.0 builds a universal (Apple Silicon + Intel) dmg and the command-line
# tool, and attaches them to a draft GitHub Release. Builds are ad-hoc signed unless the
# signing secrets are configured; see docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: macos-latest
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_APPLE_NOTARY_ID: ${{ secrets.APPLE_ID != '' }}
      HAS_APPLE_NOTARY_API: ${{ secrets.APPLE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build number = commit count

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "caffeinous-app") | .version')
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }

      # Imports APPLE_CERTIFICATE (base64 .p12, "Developer ID Application") into a temporary
      # keychain and exports SIGN_IDENTITY for scripts/bundle.sh.
      - name: Import Developer ID certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Bundle
        run: scripts/bundle.sh --universal

      # Apple ID + app-specific password, or an App Store Connect API key; Apple ID wins when
      # both are set (same rule as Slonview). The dmg submission covers the app inside it; the
      # CLI binary is submitted on its own so it also passes Gatekeeper when run from a tarball.
      - name: Notarize and staple
        if: env.HAS_APPLE_CERT == 'true' && (env.HAS_APPLE_NOTARY_ID == 'true' || env.HAS_APPLE_NOTARY_API == 'true')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ -n "$APPLE_ID" ]]; then
            auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          else
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s\n' "$APPLE_API_KEY" > "$key"
            auth=(--key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          fi
          dmg=$(ls dist/*.dmg)
          xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 30m
          xcrun stapler staple "$dmg"
          spctl -a -t open --context context:primary-signature -v "$dmg"

          cli=$(mktemp -d)
          tar -xzf dist/caffeinous-cli_*.tar.gz -C "$cli"
          ditto -c -k "$cli/caffeinous" "$RUNNER_TEMP/caffeinous-cli.zip"
          xcrun notarytool submit "$RUNNER_TEMP/caffeinous-cli.zip" "${auth[@]}" --wait --timeout 30m

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && shasum -a 256 *.dmg *.tar.gz > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --draft --title "Caffeinous $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md." dist/*.dmg dist/*.tar.gz dist/SHA256SUMS
