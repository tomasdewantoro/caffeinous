[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tomasdewantoro/caffeinous"
rust-version = "1.88"

[workspace.dependencies]
caffeinous-core = { path = "crates/core", version = "0.1.0" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
